<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro - Hospital Reservas</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </head>
    <body
        class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-200 to-indigo-200">
        <div
            class="card bg-white rounded-2xl shadow-lg p-10 w-full max-w-md animate__animated animate__fadeInDown">
            <div class="flex flex-col items-center mb-6">
                <div
                    class="bg-indigo-100 rounded-full p-4 mb-2 animate__animated animate__bounceIn">
                    <i class="fa-solid fa-user-plus fa-2x text-indigo-600"></i>
                </div>
                <h2
                    class="text-3xl font-extrabold text-gray-800 mb-1 tracking-tight animate__animated animate__fadeIn">Registro</h2>
                <span
                    class="text-indigo-500 font-semibold animate__animated animate__fadeIn animate__delay-1s">Crea
                    tu cuenta</span>
            </div>
            <form id="registerForm"
                class="space-y-5 animate__animated animate__fadeInUp">
                <div>
                    <input type="text" id="usuario" required
                        placeholder="Usuario"
                        class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition" />
                </div>
                <div>
                    <input type="email" id="correo" required
                        placeholder="Correo electrónico"
                        class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition" />
                </div>
                <div>
                    <input type="password" id="contrasena" required
                        placeholder="Contraseña"
                        class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition" />
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-3 rounded-lg hover:from-indigo-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center justify-center space-x-2 shadow-md">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Registrar</span>
                </button>
            </form>
            <!-- Botón para volver al login -->
            <button onclick="window.location.href='login.html'"
                class="w-full mt-3 bg-gray-200 text-indigo-700 py-2 rounded-lg hover:bg-gray-300 transition">
                Volver al Login
            </button>
            <div id="registerMsg"
                class="mt-4 text-center text-sm animate__animated"
                style="display:none"></div>
            <div class="mt-8 text-center text-gray-400 text-xs">
                <i class="fa-solid fa-shield-heart"></i> Hospital Reservas
                &copy; 2025
            </div>
        </div>
        <script>
        const API_URL = "http://localhost:8080/api";
        function showMsg(msg, type = "error") {
            const el = document.getElementById('registerMsg');
            el.textContent = msg;
            el.style.display = "block";
            el.className = "mt-4 text-center text-sm animate__animated animate__shakeX " +
                (type === "error" ? "text-red-600" : "text-green-600");
        }
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const correo = document.getElementById('correo').value;
            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;
            fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombreUsuario: usuario,
                    correoElectronico: correo,
                    contrasena
                })
            })
            .then(response => {
                if (!response.ok) throw new Error('Error en el registro');
                return response.json();
            })
            .then(() => {
                showMsg("¡Registro exitoso!", "success");
                setTimeout(() => window.location.href = "login.html", 1000); // 1 segundo
            })
            .catch(() => showMsg('No se pudo registrar. Intenta con otros datos.', "error"));
        });
    </script>
    </body>
</html>
